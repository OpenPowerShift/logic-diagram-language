name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "release PR" that rolls up Conventional-Commit changes, bumps the version, and updates
  # CHANGELOG.md. Merging that PR tags the release (vX.Y.Z) and creates the GitHub Release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Uses release-please-config.json + .release-please-manifest.json in the repo root.

  # When a release is cut, build and publish the library to npm via TRUSTED PUBLISHING.
  # No NPM_TOKEN: npm exchanges the GitHub OIDC id-token (permissions.id-token: write) for a
  # short-lived credential, and attaches build provenance automatically. Requires a trusted publisher
  # configured for this package on npmjs.com (repo + this workflow filename) and npm >= 11.5.1.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+set}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"
      # `npm publish` runs `prepublishOnly` (build:lib) to produce dist/, then publishes with OIDC.
      - run: npm publish
